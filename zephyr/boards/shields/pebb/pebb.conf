CONFIG_OWNTECH_AFE_DRIVER=y
CONFIG_OWNTECH_PEBB_DRIVER=y
CONFIG_OWNTECH_PEBB_AFE_CONTROL=y
CONFIG_OWNTECH_NESTED_TCA9548A=y
CONFIG_OWNTECH_HB_DRIVER=y
CONFIG_OWNTECH_PEBB_HB_CONTROL=y
CONFIG_OWNTECH_FEEDER_DRIVER=y

CONFIG_SENSOR=y
CONFIG_TMP116=y
CONFIG_EEPROM=y
CONFIG_EEPROM_TMP116=y
CONFIG_EEPROM_AT24=y
CONFIG_EEPROM_INIT_PRIORITY=91

# Zephyr 4.0 gives both TCA9548A levels priority 50 by default, while its
# driver requires channels to initialize after the root device.
CONFIG_I2C_TCA954X_ROOT_INIT_PRIO=50
CONFIG_I2C_TCA954X_CHANNEL_INIT_PRIO=51

CONFIG_OWNTECH_UART_API=n

CONFIG_USB_DEVICE_MANUFACTURER="OwnTech Technologies"
CONFIG_USB_DEVICE_PRODUCT="PEBB"
