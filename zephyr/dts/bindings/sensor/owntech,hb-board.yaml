description: OwnTech half-bridge board monitoring devices

compatible: "owntech,hb-board"

properties:
  high-side-sensor:
    type: phandle
    required: true
    description: T117B monitoring the high-side switch.

  low-side-sensor:
    type: phandle
    required: true
    description: T117B monitoring the low-side switch.

  eeprom:
    type: phandle
    required: true
    description: 24C02S EEPROM shared by the HB module.

  alert-gpios:
    type: phandle-array
    required: true
    description: High-side then low-side active-low T117B ALERT inputs.
